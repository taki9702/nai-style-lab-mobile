# Builds the Android app on every push to main and publishes it as a GitHub Release (no PC needed).
# The phone downloads: https://github.com/<owner>/<repo>/releases/latest/download/NAI-Style-Lab.apk
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version
        id: version
        run: |
          VERSION=$(node -e "const s=require('fs').readFileSync('web/js/version.js','utf8');console.log(s.match(/VERSION\s*=\s*'([^']+)'/)[1])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION (code ${GITHUB_RUN_NUMBER})"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Web build
        run: npm run build

      - name: Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Gradle build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks signing/release.jks --ks-key-alias nailab \
            --ks-pass pass:naistylelab-mobile --key-pass pass:naistylelab-mobile \
            --out NAI-Style-Lab.apk aligned.apk
          "$BT/apksigner" verify --print-certs NAI-Style-Lab.apk
          ls -la NAI-Style-Lab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NAI-Style-Lab-v${{ steps.version.outputs.version }}
          path: NAI-Style-Lab.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          NOTES=$(git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d')
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" NAI-Style-Lab.apk \
            --title "NAI Style Lab Mobile v$VERSION" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
